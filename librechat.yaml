version: "1.1.5"
cache: true

interface:
  endpointsMenu: true
  sidePanel: true
  adminPanel:
    userManagement: true
    settings: true

endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["google/gemini-2.0-flash-exp"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "Inside AI"

registration:
  enabled: true
  initialCredits: 1000

balance:
  enabled: true
